name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps for the Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Backend tests
        run: cd src-tauri && cargo test


  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            asset_pattern: "QR.Converter_[version]_macos-[arch][ext]"
            artifact_name: macos-arm64
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            asset_pattern: "QR.Converter_[version]_windows-[arch]-online[setup][ext]"
            artifact_name: windows-online
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.offline.conf.json
            asset_pattern: "QR.Converter_[version]_windows-[arch]-offline[setup][ext]"
            artifact_name: windows-offline

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS arm64 target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QR Converter ${{ github.ref_name }}
          releaseBody: |
            ## Downloads
            - **macOS (Apple Silicon / arm64)**: `.dmg`
            - **Windows online (x64 · no embedded WebView2)**: small `.exe`; downloads and installs
              WebView2 only if it is missing or older than 109.0.1518.140 (internet required).
            - **Windows offline (x64 · WebView2 embedded)**: large `.exe` (~300 MB); installs
              WebView2 from the embedded offline runtime only if it is missing or older than
              109.0.1518.140 (no internet required). This variant installs per-machine and
              requires administrator rights; the online variant keeps the per-user default.

            Minimum Windows: Windows 10 1809/LTSC or later.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          args: ${{ matrix.args }}
